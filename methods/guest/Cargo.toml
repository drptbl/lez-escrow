[package]
name = "logos_escrow_guest"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# Built on its own by `cargo risczero build`, outside the host workspace.
[workspace]

[profile.release]
# Part of the program's identity: the image id is computed over this binary.
debug = 0
strip = "symbols"

[[bin]]
name = "logos_escrow"
path = "src/bin/logos_escrow.rs"

# Test-only: relays escrow calls so tests can call the escrow from another program. Never deploy.
[[bin]]
name = "test_controller"
path = "src/bin/test_controller.rs"

[dependencies]
logos_escrow_core = { path = "../../core" }
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.3.1" }
borsh = { version = "1.5.7", features = ["derive"] }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }
