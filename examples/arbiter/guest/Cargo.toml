[package]
name = "logos_escrow_arbiter_guest"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# Built on its own by `cargo risczero build`, apart from the escrow's guest, so the escrow's
# image id never depends on this example.
[workspace]

[profile.release]
debug = 0
strip = "symbols"

[[bin]]
name = "example_arbiter"
path = "src/bin/example_arbiter.rs"

[dependencies]
logos_escrow_arbiter = { path = ".." }
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.3.1" }
borsh = { version = "1.5.7", features = ["derive"] }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }
