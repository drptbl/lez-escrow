[package]
name = "lez_escrow_cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "lez-escrow"
path = "src/main.rs"

[dependencies]
lez_escrow_core = { path = "../core" }
lee_core.workspace = true
borsh.workspace = true
# The wallet `lez_core` wraps, so calls take the same path logos-mcp's will.
wallet = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.3.1" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
