[workspace]
resolver = "3"
members = ["core", "integration", "cli", "prototype/private-job"]
exclude = ["methods/guest"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# LEZ v0.3.1 is the release the public testnet runs and lez_core 0.5.1 is built on.
[workspace.dependencies]
lee = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.3.1" }
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.3.1" }
borsh = { version = "1.5.7", features = ["derive"] }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }
